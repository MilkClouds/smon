[project]
name = "smon"
dynamic = ["version"]
description = "A terminal user interface (TUI) for monitoring Slurm clusters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich",
    "textual",
    "websockets>=15.0.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff>=0.15.10",
]

[project.scripts]
smon = "smon:main"

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/smon/_version.py"
